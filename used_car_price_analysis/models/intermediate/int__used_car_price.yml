models:
  - name: int__used_car_price
    description: " Silver layer of the used car price "
    columns:
      - name: vechicle_id_number
        data_type: string
        description: "{{  doc('vechicle_id_number') }}"
        tests:
          - not_null 

      - name: manufactured_year
        data_type: int64
        description: "{{  doc('manufactured_year')  }}"

      - name: make
        data_type: string
        description: "{{  doc('make') }}"

      - name: model
        data_type: string
        description: "{{  doc('model')  }}"

      - name: body_type
        data_type: string
        description: "{{  doc('body_type')  }}"

      - name: transmission
        data_type: string
        description: "{{  doc('transmission') }}"

      - name: state
        data_type: string
        description: "{{  doc('state')  }}"
        tests:
          - not_null 

      - name: condition
        data_type: float64
        description: "{{  doc('condition')  }}"

      - name: odometer
        data_type: float64
        description: "{{  doc('odometer') }}"
        tests: 
          - not_null

      - name: color
        data_type: string
        description: "{{  doc('color')  }}"

      - name: interior
        data_type: string
        description: "{{  doc('interior') }}"

      - name: seller
        data_type: string
        description: "{{  doc('seller') }}"
        tests:
          - not_null

      - name: manheim_market_report
        data_type: float64
        description: "{{  doc('manheim_market_report')  }}"

      - name: sellingprice
        data_type: float64
        description: "{{  doc('sellingprice') }}"
        tests:
          - not_null

      - name: saledate
        data_type: date
        description: "{{  doc('saledate') }}"
        tests:
          - not_null
